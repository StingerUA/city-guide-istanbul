name: Verify City Guide
on:
  pull_request:
  push:
    branches: [main, feat/cloudflare-supabase-runtime-20261012]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
