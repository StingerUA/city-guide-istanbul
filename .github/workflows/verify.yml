name: Verify City Guide
on:
  pull_request:
  push:
    branches: [main, feat/cloudflare-supabase-runtime-20261012]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      - run: pnpm test:security

      - name: Smoke-test standalone Worker sign-in route
        shell: bash
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --port 8787 --inspector-port 0 > /tmp/city-guide-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/signin -o /tmp/city-guide-signin.html; then
              grep -q 'City Guide' /tmp/city-guide-signin.html
              exit $?
            fi
            sleep 2
          done
          cat /tmp/city-guide-worker.log
          exit 1

      - name: Verify OAuth initiation, PKCE cookies and CSRF rejection
        shell: bash
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --port 8788 --inspector-port 0 > /tmp/city-guide-oauth.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl -sS --max-time 2 -D /tmp/city-guide-oauth-headers -o /dev/null 'http://127.0.0.1:8788/api/auth/google?return_to=%2Fadmin'; then
              if grep -qi 'location: https://qfohfbuwnpjcbhmyosaf.supabase.co/auth/v1/authorize' /tmp/city-guide-oauth-headers; then break; fi
            fi
            sleep 2
          done
          grep -qi '^HTTP/1.1 307' /tmp/city-guide-oauth-headers
          grep -qi 'code_challenge=' /tmp/city-guide-oauth-headers
          grep -qi 'cg_google_pkce_verifier=' /tmp/city-guide-oauth-headers
          grep -qi 'cg_google_oauth_flow=' /tmp/city-guide-oauth-headers
          curl -sS --max-time 10 -D /tmp/city-guide-oauth-invalid -o /dev/null 'http://127.0.0.1:8788/api/auth/google/callback?code=fake&flow=wrong'
          grep -qi '^HTTP/1.1 307' /tmp/city-guide-oauth-invalid
          grep -qi 'oauth_error=invalid_flow' /tmp/city-guide-oauth-invalid
          echo "GOOGLE_OAUTH_LOCAL_SMOKE_OK"
